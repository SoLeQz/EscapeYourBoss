<script>const vues=[['fauteuil','Fauteuil, bois et métal','Moins de stries et de reflets chromés ; grain fin et placage irrégulier.'],['cloisons','Textiles de bureau','Une texture partagée, sans étirement sur les longues cloisons.'],['sol','Sols minéraux','Agrégats discrets et rugosité mate.'],['escalier-volume','Béton et garde-corps','Béton distinct des murs peints, métal plus sobre.'],['open-space','Vue de jeu','Une moquette calme et une échelle de détail cohérente.'],['direction','Bureau de direction','Le même fil de bois, avec une teinte plus sombre.']];document.getElementById('comparaisons').innerHTML=vues.map(([id,titre,texte])=>`<h2>${titre}</h2><p>${texte}</p><div class="duo"><figure class="avant"><img loading="lazy" src="avant/${id}.jpg" alt="${titre}, avant"><figcaption>Avant · 1.1.1</figcaption></figure><figure class="apres"><img loading="lazy" src="apres/${id}.jpg" alt="${titre}, après"><figcaption>Après · 1.2.0</figcaption></figure></div>`).join('');</script></html>
